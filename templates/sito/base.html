<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111418">
<title>{% block titolo %}VOLTA Social{% endblock %}</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #17181a; --muted: #6b6e73; --line: #e6e3dd; --accent: #2b59c3;
    --s-bozza: #8b8f96; --s-da_rivedere: #c98a12; --s-da_correggere: #d2442f; --s-pronto: #2b6fd6;
    --s-approvato: #0f8a74; --s-programmato: #6a4bd1; --s-pubblicato: #2f9e44; --s-errore: #c92a2a; --s-scartato: #b5b8bd;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111418; --card: #1a1e24; --ink: #ecedef; --muted: #9aa0a8; --line: #2a3038; --accent: #7aa2ff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #111418; --card: #1a1e24; --ink: #ecedef; --muted: #9aa0a8; --line: #2a3038; --accent: #7aa2ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  .wrap { max-width: 860px; margin: 0 auto; padding-block: 16px 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
  .brand { font-weight: 800; letter-spacing: .08em; font-size: 13px; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .sub { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; user-select: none; }
  .chip .pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .chip.on { outline: 2px solid var(--accent); }
  .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #fff;
    padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  {% for s in stati %}.s-{{ s }} { background: var(--s-{{ s }}); }{% endfor %}
  .muted { color: var(--muted); }
  .footer { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; }
  {% block stile %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="{{ radice }}index.html">VOLTA Social</a><span class="sub">{{ aggiornato }}</span></div>
  {% block corpo %}{% endblock %}
  <div class="footer">Pagina generata da scripts/calendario.py · non indicizzata</div>
</div>
{% block script %}{% endblock %}
</body>
</html>
