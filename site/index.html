<style>

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  a { color: var(--accent); text-decoration: none; }

  .chip .pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .chip.on { outline: 2px solid var(--accent); }
  .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #fff;
    padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .s-bozza { background: var(--s-bozza); }.s-da_rivedere { background: var(--s-da_rivedere); }.s-da_correggere { background: var(--s-da_correggere); }.s-pronto { background: var(--s-pronto); }.s-approvato { background: var(--s-approvato); }.s-programmato { background: var(--s-programmato); }.s-pubblicato { background: var(--s-pubblicato); }.s-errore { background: var(--s-errore); }.s-scartato { background: var(--s-scartato); }
  .muted { color: var(--muted); }
  .footer { margin-top: 40px; font-size: 12px; color: var(--muted); text-align: center; }
  
  .clienti { display: grid; gap: 12px; }
  .cliente h3 { margin: 0 0 2px; font-size: 18px; }
  .mesi { display: grid; gap: 8px; margin-top: 12px; }
  .mese { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
  .barra { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .barra span { display: block; height: 100%; }
  .riga-stati { font-size: 12px; color: var(--muted); }
  .inattivo { opacity: .6; }

</style>
</head>

</div>
